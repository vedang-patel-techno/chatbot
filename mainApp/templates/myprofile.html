<!DOCTYPE html>
<html>
<head>
    <title>My Profile - My Blogs</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f9f9f9; }
        h1 { color: #333; }
        .blog-container { display: flex; flex-wrap: wrap; gap: 20px; }
        .blog { border: 1px solid #ddd; padding: 15px; background-color: #fff; border-radius: 5px; width: 45%; position: relative; }
        .delete-btn { position: absolute; top: 10px; right: 10px; padding: 5px 10px; background-color: #dc3545; color: white; border: none; border-radius: 3px; cursor: pointer; }
        .delete-btn:hover { background-color: #c82333; }
        p.no-blogs { font-style: italic; color: #666; }
    </style>
</head>
<body>
    <h1>My Blogs</h1>

    {% if data and data|length > 0 %}
    <div class="blog-container">
        {% for blog in data %}
        <div class="blog">
            <p>{{ blog.blog }}</p>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="delete-btn">Delete</button>
            </form>
        </div>
        {% endfor %}
    </div>
    {% else %}
        <p class="no-blogs">You have not added any blogs yet.</p>
    {% endif %}
</body>
</html>
